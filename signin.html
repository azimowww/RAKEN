<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAKEN - Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { scroll-behavior: smooth; }
        body { font-family: Arial, sans-serif; color: #111; overflow-x: hidden; background-color: #fff; }
        
        .navbar { background: #fff; border-bottom: 1px solid #ddd; padding: 18px 0; }
        .logo { font-size: 28px; font-weight: bold; letter-spacing: 5px; cursor: pointer; text-decoration: none; color: #111; }
        .logo:hover { color: #111; }
        .nav-link { color: #111 !important; font-weight: 600; margin: 0 12px; transition: .3s; }
        .nav-link:hover { transform: translateY(-2px); }
        #languageSelect { width: 75px; border-radius: 0; }

        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 100px);
            background: #f8f9fa;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid #eaeaea;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-container h2 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
            color: #111;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #111;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .auth-btn:hover {
            background: #333;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">

        <a class="navbar-brand logo" href="signin.html">RAKEN</a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html" data-lang="home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="shop.html" data-lang="shop">Shop</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html" data-lang="about">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="contact.html" data-lang="contact">Contact</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">

                <select id="languageSelect"
                    class="form-select form-select-sm"
                    onchange="changeLanguage(this.value)">
                    <option value="EN">EN</option>
                    <option value="RU">RU</option>
                    <option value="AZ">AZ</option>
                </select>

                <div class="d-flex align-items-center gap-1">

                    <a href="https://www.instagram.com/raken.wear?dmpr=MXYwbndwZjR1ZW41Mg%3D%3D&utm_source=qr"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-btn instagram-btn"
                        title="Instagram">
                        <i class="bi bi-instagram"></i>
                    </a>

                    <a href="https://tiktok.com/@raken.clothing"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-btn tiktok-btn"
                        title="TikTok">
                        <i class="bi bi-tiktok"></i>
                    </a>

                </div>

                <div class="dropdown">

                    <button class="btn btn-dark cart-button dropdown-toggle cart-button-oval"
                        type="button"
                        id="cartDropdownMenu"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">

                        <i class="bi bi-bag"></i>

                    </button>

                    <div class="dropdown-menu cart-dropdown"
                        aria-labelledby="cartDropdownMenu"
                        id="dropdownMenuContent">
                    </div>

                </div>

            </div>
        </div>
    </div>
</nav>
<div class="auth-wrapper">
    <div class="auth-container">
        <h2 data-lang="signInTitle">Sign In</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="name" data-lang="nameLabel">Your Name</label>
                <input type="text" id="name" required placeholder="Azimov">
            </div>
            <div class="form-group">
                <label for="email" data-lang="emailLabel">Email</label>
                <input type="email" id="email" required placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label for="password" data-lang="passwordLabel">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="auth-btn" data-lang="loginBtn">Login</button>
        </form>
        <div id="message"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const translations = {
        EN: {
            home: "Home", shop: "Shop", about: "About", contact: "Contact",
            signInTitle: "Sign In",
            nameLabel: "Your Name",
            emailLabel: "Email",
            passwordLabel: "Password",
            loginBtn: "Login",
            successMsg: "You have successfully logged in!"
        },
        RU: {
            home: "Главная", shop: "Магазин", about: "О нас", contact: "Контакты",
            signInTitle: "Вход в аккаунт",
            nameLabel: "Ваше имя",
            emailLabel: "Электронная почта",
            passwordLabel: "Пароль",
            loginBtn: "Войти",
            successMsg: "Вы успешно зашли в аккаунт!"
        },
        AZ: {
            home: "Ana səhifə", shop: "Mağaza", about: "Haqqımızda", contact: "Əlaqə",
            signInTitle: "Daxil ol",
            nameLabel: "Adınız",
            emailLabel: "Elektron poçt",
            passwordLabel: "Şifrə",
            loginBtn: "Daxil ol",
            successMsg: "Hesaba uğurla daxil oldunuz!"
        }
    };

    const languageSelect = document.getElementById('languageSelect');

    function changeLanguage(lang) {
        document.querySelectorAll('[data-lang]').forEach(el => {
            const key = el.getAttribute('data-lang');
            if (translations[lang] && translations[lang][key]) {
                el.textContent = translations[lang][key];
            }
        });
        localStorage.setItem('selectedLang', lang);
        localStorage.setItem('rakenLang', lang);
    }

    languageSelect.addEventListener('change', (e) => {
        changeLanguage(e.target.value);
    });

    window.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem('selectedLang') || localStorage.getItem('rakenLang') || 'EN';
        languageSelect.value = savedLang;
        changeLanguage(savedLang);
    });

    // Динамически сохраняем то имя, которое ввел пользователь
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const enteredName = document.getElementById('name').value; // Берем имя из поля ввода
        
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('userName', enteredName); // Сохраняем имя реального пользователя
        
        const messageDiv = document.getElementById('message');
        const currentLang = languageSelect.value;
        
        messageDiv.style.color = 'green';
        messageDiv.textContent = translations[currentLang].successMsg;
        
        setTimeout(function() {
            window.location.href = 'index.html';
        }, 1500);
    });
</script>

</body>
</html>
