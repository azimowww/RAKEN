<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAKEN - Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { scroll-behavior: smooth; }
        body { font-family: Arial, sans-serif; color: #111; background-color: #fafafa; }
        
        .navbar { background: #fff; border-bottom: 1px solid #eaeaea; padding: 18px 0; }
        .logo { font-size: 28px; font-weight: bold; letter-spacing: 5px; cursor: pointer; text-decoration: none; color: #111; }
        .logo:hover { color: #111; }
        .nav-link { color: #111 !important; font-weight: 600; margin: 0 12px; transition: .3s; }
        .nav-link:hover { transform: translateY(-2px); }
        #languageSelect { width: 75px; border-radius: 0; }

        .orders-wrapper {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .orders-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .order-card {
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.02);
            transition: all 0.2s ease;
        }

        .order-card:hover {
            border-color: #ccc;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .order-id {
            font-weight: bold;
            font-size: 15px;
        }

        .order-date {
            color: #777;
            font-size: 13px;
        }

        .badge-status {
            background: #e6f4ea;
            color: #137333;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .order-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .order-items-text {
            color: #555;
        }

        .order-total {
            font-weight: bold;
            font-size: 16px;
        }

        .empty-orders {
            text-align: center;
            padding: 60px 20px;
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 12px;
        }

        .empty-orders i {
            font-size: 48px;
            color: #ccc;
            margin-bottom: 15px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            margin-top: 20px;
            background: #111;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: #333;
            color: #fff;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">

        <a class="navbar-brand logo" href="orders.html">RAKEN</a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html" data-lang="home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="shop.html" data-lang="shop">Shop</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html" data-lang="about">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="contact.html" data-lang="contact">Contact</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">

                <select id="languageSelect"
                    class="form-select form-select-sm"
                    onchange="changeLanguage(this.value)">
                    <option value="EN">EN</option>
                    <option value="RU">RU</option>
                    <option value="AZ">AZ</option>
                </select>

                <div class="d-flex align-items-center gap-1">

                    <a href="https://www.instagram.com/raken.wear?dmpr=MXYwbndwZjR1ZW41Mg%3D%3D&utm_source=qr"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-btn instagram-btn"
                        title="Instagram">
                        <i class="bi bi-instagram"></i>
                    </a>

                    <a href="https://tiktok.com/@raken.clothing"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-btn tiktok-btn"
                        title="TikTok">
                        <i class="bi bi-tiktok"></i>
                    </a>

                </div>

                <div class="dropdown">

                    <button class="btn btn-dark cart-button dropdown-toggle cart-button-oval"
                        type="button"
                        id="cartDropdownMenu"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">

                        <i class="bi bi-bag"></i>

                    </button>

                    <div class="dropdown-menu cart-dropdown"
                        aria-labelledby="cartDropdownMenu"
                        id="dropdownMenuContent">
                    </div>

                </div>

            </div>
        </div>
    </div>
</nav>

<!-- Контент раздела Orders -->
<div class="orders-wrapper">
    <h2 class="orders-title" data-lang="ordersTitle">Orders</h2>

    <!-- Если заказов нет (по умолчанию отображается, пока нет данных в localStorage) -->
    <div id="emptyState" class="empty-orders">
        <i class="bi bi-box-seam"></i>
        <h5 class="fw-bold mb-2" data-lang="noOrdersTitle">No orders yet</h5>
        <p class="text-muted small mb-3" data-lang="noOrdersText">When you place orders, they will appear here.</p>
        <a href="shop.html" class="back-btn" data-lang="startShopping">Start Shopping</a>
    </div>

    <!-- Список заказов (сюда можно будет динамически подгружать заказы из localStorage) -->
    <div id="ordersList" style="display: none;">
        <!-- Пример карточки заказа (будет генерироваться или выводиться здесь) -->
        <div class="order-card">
            <div class="order-header">
                <div>
                    <div class="order-id">Order #RAK-8492</div>
                    <div class="order-date">20 September 2026</div>
                </div>
                <span class="badge-status">Delivered</span>
            </div>
            <div class="order-details">
                <div class="order-items-text">Monochrome Hoodie (x1)</div>
                <div class="order-total">$120.00</div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const translations = {
        EN: {
            home: "Home", shop: "Shop", about: "About", contact: "Contact",
            ordersTitle: "Orders",
            noOrdersTitle: "No orders yet",
            noOrdersText: "When you place orders, they will appear here.",
            startShopping: "Start Shopping"
        },
        RU: {
            home: "Главная", shop: "Магазин", about: "О нас", contact: "Контакты",
            ordersTitle: "Заказы",
            noOrdersTitle: "У вас пока нет заказов",
            noOrdersText: "Когда вы оформите заказ, он появится здесь.",
            startShopping: "Перейти к покупкам"
        },
        AZ: {
            home: "Ana səhifə", shop: "Mağaza", about: "Haqqımızda", contact: "Əlaqə",
            ordersTitle: "Sifarişlər",
            noOrdersTitle: "Hələ ki sifariş yoxdur",
            noOrdersText: "Sifariş verdiyiniz zaman burada görünəcək.",
            startShopping: "Alış-verişə başla"
        }
    };

    const languageSelect = document.getElementById('languageSelect');

    function changeLanguage(lang) {
        document.querySelectorAll('[data-lang]').forEach(el => {
            const key = el.getAttribute('data-lang');
            if (translations[lang] && translations[lang][key]) {
                el.textContent = translations[lang][key];
            }
        });
        localStorage.setItem('selectedLang', lang);
        localStorage.setItem('rakenLang', lang);
    }

    languageSelect.addEventListener('change', (e) => {
        changeLanguage(e.target.value);
    });

    window.addEventListener('DOMContentLoaded', () => {
        // Проверка авторизации
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        if (isLoggedIn !== 'true') {
            window.location.href = 'signin.html';
            return;
        }

        // Установка языка
        const savedLang = localStorage.getItem('selectedLang') || localStorage.getItem('rakenLang') || 'EN';
        languageSelect.value = savedLang;
        changeLanguage(savedLang);

        // Здесь в будущем можно будет добавить проверку: если в localStorage есть сохраненные заказы пользователя,
        // скрывать #emptyState и выводить их в #ordersList.
    });
</script>
</body>
</html>
