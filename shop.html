<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAKEN — Shop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
    
*{scroll-behavior:smooth}
body{font-family:Arial,sans-serif;color:#111;overflow-x:hidden;animation:fadeIn .8s ease;background:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.navbar{background:#fff;border-bottom:1px solid #ddd;padding:18px 0}
.logo{font-size:28px;font-weight:bold;letter-spacing:5px;cursor:pointer}
.nav-link{color:#111!important;font-weight:600;margin:0 12px;transition:.3s}
.nav-link:hover{transform:translateY(-2px)}
#languageSelect{width:75px;border-radius:20px;padding:4px 10px;font-size:13px;font-weight:600}
.cart-dropdown{width:320px;right:0;left:auto!important;padding:20px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.15);border:1px solid #eee;margin-top:12px!important}
.cart-dropdown h6{font-size:18px;font-weight:bold;margin-bottom:8px;color:#111}
.signin-prompt{font-size:13px;color:#555;margin-bottom:15px;border-bottom:1px solid #eaeaea;padding-bottom:10px}
.profile-link{display:flex;align-items:center;gap:12px;color:#333;text-decoration:none;padding:8px 0;font-size:15px;transition:color .2s;cursor:pointer}
.profile-link i{font-size:18px;color:#555}
.profile-link:hover,.profile-link:hover i{color:#000}
.social-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #ddd;color:#111;background:#fff;text-decoration:none;border-radius:50%;transition:all .3s ease}
.whatsapp-btn:hover{background:#25d366;color:#fff;border-color:#25d366;transform:translateY(-3px) scale(1.08)}
.tiktok-btn:hover{background:#000;color:#fff;border-color:#000;transform:translateY(-3px) scale(1.08)}
.cart-button-oval{border-radius:30px!important;padding:6px 16px!important}
.detail-img-container{height:480px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f8f9fa;border:1px solid #eee;position:relative;border-radius:18px}
.animated-detail-hoodie{max-height:80%;max-width:80%;object-fit:contain;mix-blend-mode:multiply;transition:transform .5s}
.round-nav-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.95);border:1px solid #111;color:#111;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .25s;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.round-nav-btn:hover{background:#111;color:#fff;transform:scale(1.1)}
.btn-back-custom{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#111;border:2px solid #111;border-radius:30px;padding:10px 24px;font-weight:bold;font-size:14px;text-transform:uppercase;letter-spacing:1px;text-decoration:none;transition:all .3s;box-shadow:0 4px 10px rgba(0,0,0,.05)}
.btn-back-custom:hover{background:#111;color:#fff;transform:translateY(-2px)}
.product-card{background:#f8f9fa;border:1px solid #eee;padding:25px 20px;text-align:center;display:flex;flex-direction:column;justify-content:space-between;min-height:480px;position:relative;transition:.3s;border-radius:20px;height:100%}
.product-card:hover{transform:translateY(-5px);box-shadow:0 10px 25px rgba(0,0,0,.06)}
.save-btn{position:absolute;top:15px;right:15px;background:#fff;border:1px solid #ddd;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;opacity:0;visibility:hidden;transition:all .3s;box-shadow:0 4px 10px rgba(0,0,0,.08)}
.product-card:hover .save-btn,.save-btn.saved{opacity:1;visibility:visible}
.save-btn i{font-size:16px;color:#111}
.save-btn:hover,.save-btn.saved{background:#111;border-color:#111}
.save-btn:hover i,.save-btn.saved i{color:#fff}
.product-img-wrap{height:220px;display:flex;align-items:center;justify-content:center;margin-bottom:15px;cursor:pointer;overflow:hidden}
.product-img{max-height:100%;max-width:100%;object-fit:contain;mix-blend-mode:multiply;transition:transform .5s}
.product-card:hover .product-img{transform:scale(1.05)}
.product-price{font-weight:bold;color:#111;margin-bottom:12px;font-size:16px}
.btn-shop-action{border-radius:30px!important;font-weight:600;font-size:13px;transition:all .3s}
.btn-shop-action:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.15)}
.size-btn{border-radius:0;min-width:48px;border:1px solid #111;background:#fff;color:#111;transition:all .2s;font-weight:600}
.size-btn.active,.size-btn:hover{background:#111;color:#fff;transform:translateY(-2px)}
.btn-add-cart{background:#fff;color:#111;border:2px solid #111;border-radius:30px;padding:12px 20px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;transition:all .3s}
.btn-add-cart:hover{background:#111;color:#fff;transform:translateY(-2px)}
.detail-save-btn{border-radius:30px;border:2px solid #111;background:#fff;color:#111;padding:12px 24px;font-weight:bold;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .3s;cursor:pointer;text-transform:uppercase;letter-spacing:1px}
.detail-save-btn:hover,.detail-save-btn.saved{background:#111;color:#fff}
.product-description{white-space:pre-line;line-height:1.8}
footer{background:#0b0b0b;color:#fff;padding:50px 0 30px;margin-top:70px}
@media(max-width:767px){.product-card{min-height:450px}.detail-img-container{height:350px}.logo{font-size:24px}}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">

        <a class="navbar-brand logo" href="shop.html">RAKEN</a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html" data-lang="home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="shop.html" data-lang="shop">Shop</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html" data-lang="about">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="contact.html" data-lang="contact">Contact</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">

                <select id="languageSelect"
                    class="form-select form-select-sm"
                    onchange="changeLanguage(this.value)">
                    <option value="EN">EN</option>
                    <option value="RU">RU</option>
                    <option value="AZ">AZ</option>
                </select>

                <div class="d-flex align-items-center gap-1">

                    <a href="https://www.instagram.com/raken.wear?dmpr=MXYwbndwZjR1ZW41Mg%3D%3D&utm_source=qr"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-btn instagram-btn"
                        title="Instagram">
                        <i class="bi bi-instagram"></i>
                    </a>

                    <a href="https://tiktok.com/@raken.clothing"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-btn tiktok-btn"
                        title="TikTok">
                        <i class="bi bi-tiktok"></i>
                    </a>

                </div>

                <div class="dropdown">

                    <button class="btn btn-dark cart-button dropdown-toggle cart-button-oval"
                        type="button"
                        id="cartDropdownMenu"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">

                        <i class="bi bi-bag"></i>

                    </button>

                    <div class="dropdown-menu cart-dropdown"
                        aria-labelledby="cartDropdownMenu"
                        id="dropdownMenuContent">
                    </div>

                </div>

            </div>
        </div>
    </div>
</nav>
<div class="container py-5" id="appContent"></div>
<footer><div class="container text-center text-secondary small">
<p class="mb-2" data-lang="footer_contact">To order, please contact us via phone or WhatsApp.</p>
© 2026 RAKEN. <span data-lang="rights">All rights reserved.</span>
</div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const translations = {
EN:{home:"Home",shop:"Shop",about:"About",contact:"Contact",shop_title:"RAKEN SHOP",shop_subtitle:"Explore our collection.",view:"View",cart:"Cart",add_to_cart:"ADD TO CART",back:"Back to Products",select_size:"SELECT SIZE",select_size_alert:"Please select a size!",bagEmpty:"Your Bag is empty.",bagSigninText:"Sign in to see if you have any saved items",myProfile:"My Profile",menuSaves:"Your Saves",menuCart:"Cart",menuAccount:"Account",menuSignin:"Sign in",menuSignout:"Sign out",footer_contact:"To order, please contact us via phone or WhatsApp.",rights:"All rights reserved.",save:"Save",saved:"Saved"},
RU:{home:"Главная",shop:"Каталог",about:"О нас",contact:"Контакты",shop_title:"МАГАЗИН RAKEN",shop_subtitle:"Изучите нашу коллекцию.",view:"Смотреть",cart:"Корзина",add_to_cart:"ДОБАВИТЬ В КОРЗИНУ",back:"Назад к товарам",select_size:"ВЫБЕРИТЕ РАЗМЕР",select_size_alert:"Пожалуйста, выберите размер!",bagEmpty:"Ваша сумка пуста.",bagSigninText:"Войдите, чтобы увидеть сохраненные товары",myProfile:"Мой профиль",menuSaves:"Избранное",menuCart:"Корзина",menuAccount:"Аккаунт",menuSignin:"Войти",menuSignout:"Выйти",footer_contact:"Для заказа свяжитесь с нами по телефону или WhatsApp.",rights:"Все права защищены.",save:"Сохранить",saved:"Сохранено"},
AZ:{home:"Ana səhifə",shop:"Mağaza",about:"Haqqımızda",contact:"Əlaqə",shop_title:"RAKEN MAĞAZASI",shop_subtitle:"Kolleksiyamızla tanış olun.",view:"Bax",cart:"Səbət",add_to_cart:"SƏBƏTƏ AT",back:"Məhsullara qayıt",select_size:"ÖLÇÜNÜ SEÇİN",select_size_alert:"Zəhmət olmasa ölçü seçin!",bagEmpty:"Səbətiniz boşdur.",bagSigninText:"Yadda saxladığınız məhsulları görmək üçün daxil olun",myProfile:"Profilim",menuSaves:"Bəyəndiklərim",menuCart:"Səbət",menuAccount:"Hesab",menuSignin:"Daxil ol",menuSignout:"Çıxış",footer_contact:"Sifariş üçün zəng edin və ya WhatsApp-a yazın.",rights:"Bütün hüquqlar qorunur.",save:"Bəyən",saved:"Bəyənildi"}
};
let currentLang=localStorage.getItem('rakenLang')||'EN';

const products = [
{id:1,title:"RAKEN — SORRY MAMMA!",priceNum:25,price:"25 AZN",desc:"SORRY MAMMA! STILL DRUNK FROM LAST NIGHT. Designed for those who don't take life too seriously.",img:"8.jpeg"},
{id:2,title:"RAKEN — LIFE IS BEST DANCING WITH YOU IN MYKONOS.",priceNum:35,price:"35 AZN",desc:"A clean and expressive T-shirt inspired by summer nights, freedom, and unforgettable moments. The bold red typography gives the design a distinctive look, while the simple white base keeps it fresh and versatile. A reminder to forget the noise, enjoy the moment, and dance through life with someone special. Live the moment. Make it unforgettable.",img:"foto2.jpeg"},
{id:3,title:"RAKEN — SOCIAL MEDIA IS FAKE (Dark)",priceNum:25,price:"25 AZN",desc:"Classic dark edition. Less social media. More real life.",img:"foto5.jpeg"},
{id:4,title:"RAKEN — SOCIAL MEDIA IS FAKE (White 1)",priceNum:25,price:"25 AZN",desc:"Clean white colorway with bold black typography.",img:"foto4.jpeg"},
{id:5,title:"RAKEN — LIVE WITHOUT FILTERS (Black)",priceNum:25,price:"25 AZN",desc:"Deep black edition of the signature LIVE WITHOUT FILTERS heavyweight streetwear tee.",img:"foto7.jpeg"},
{id:6,title:"RAKEN — I CALL THAT FASHION",priceNum:25,price:"25 AZN",desc:"A bold graphic T-shirt made for those who see fashion differently.",img:"foto1.jpeg"},
{id:7,title:"RAKEN — DON'T DO REVENGE, DO DISTANCE.",priceNum:25,price:"25 AZN",desc:"Some things are better left behind. No revenge, just distance.\n\nA minimal design with a message that speaks for itself.\n\nRAKEN | EST. 2026\n\nAvailable now.",img:"9.jpeg"},
{id:8,title:"RAKEN — SHE WAS MY FIRST WORLD CUP, BUT I WAS MESSI.",priceNum:25,price:"25 AZN",desc:"Some stories are unforgettable. Some legends never fade.\n\nA football-inspired design with a little humor, nostalgia and the spirit of the game. Made for those who carry football beyond the pitch.\n\nRAKEN — wear your story.\n\nAvailable now.",img:"10.jpeg"},
{id:9,title:"RAKEN — MAYBE HE'S A DEBIL.",priceNum:25,price:"25 AZN",desc:"Some words say it all. Bold red lettering, a clean design, and a statement that speaks without explanation.\n\nRAKEN | EST. 2026\n\nAvailable now.",img:"11.jpeg"},
{id:10,title:"RAKEN — I TOLD MY BABUSHKA ABOUT YOU.",priceNum:25,price:"25 AZN",desc:"A little humor, a little attitude, and a statement you won't forget. Made to stand out without saying too much.\n\nRAKEN | EST. 2026\n\nAvailable now.",img:"14.jpeg"},
{id:11,title:"RAKEN — SHE WAS MY WORLD CUP, BUT I WAS RONALDO.",priceNum:25,price:"25 AZN",desc:"Not every love story ends with a trophy. Some leave you with a legendary quote.\n\nA football-inspired statement piece with a touch of humor, nostalgia and the spirit of the game.\n\nFor those who know the difference between losing love and losing a final.\n\nRAKEN — wear your story.\n\nAvailable now.",img:"13.jpeg"},
{id:12,title:"RAKEN — BAKU TIME.",priceNum:35,price:"35 AZN",desc:"A little piece of Baku, made to be worn.\n\nInspired by the lights, architecture and atmosphere of our city. A design that carries a story beyond the streets.\n\nRAKEN | EST. 2026\n\nAvailable now.",img:"12.jpeg"},
{id:13,title:"RAKEN — CRAZY BOYFRIEND",priceNum:35,price:"35 AZN",desc:"A statement made in bold letters. A little attitude, a little humor, and a design that speaks for itself.\n\n\"Don't talk to me, I have a crazy boyfriend.\"\n\nMinimalist style, bold red print, and a message you won't forget.\n\nRAKEN™ | EST. 2026\n\nAvailable now.",img:"15.jpeg"},
{id:14,title:"RAKEN — MYKONOS",priceNum:25,price:"25 AZN",desc:"A phrase that captures the feeling of unforgettable nights, music, and moments worth keeping.\n\n\"Life is best dancing with you in Mykonos.\"\n\nMade for memories, late nights, and the moments that feel like summer forever.\n\nRAKEN™️ | EST. 2026\n\nAvailable now.",img:"16.jpeg"},];

let selectedSize=null;
function getSavedItems(){return JSON.parse(localStorage.getItem('rakenSaves'))||[]}
function toggleSaveProduct(id,event){if(event)event.stopPropagation();let saved=getSavedItems();let index=saved.indexOf(id);if(index>-1)saved.splice(index,1);else saved.push(id);localStorage.setItem('rakenSaves',JSON.stringify(saved));initApp()}
function initApp(){
document.getElementById('languageSelect').value=currentLang;
applyTranslations();updateHeaderAccountState();
const productId=new URLSearchParams(window.location.search).get('id');
if(productId!==null){const found=products.find(p=>p.id==productId);if(found){renderProductDetail(found);return}}
renderShopGrid(products);
}
function changeLanguage(lang){
currentLang=lang;localStorage.setItem('rakenLang',lang);applyTranslations();updateHeaderAccountState();
const productId=new URLSearchParams(window.location.search).get('id');
if(productId!==null){const found=products.find(p=>p.id==productId);if(found)renderProductDetail(found)}
else renderShopGrid(products);
}
function applyTranslations(){const t=translations[currentLang];document.querySelectorAll('[data-lang]').forEach(el=>{const key=el.getAttribute('data-lang');if(t[key])el.textContent=t[key]})}
function renderShopGrid(list){
const t=translations[currentLang],savedIds=getSavedItems();
document.getElementById('appContent').innerHTML=`
<div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-5"><div><h1 class="fw-bold mb-1">${t.shop_title}</h1><p class="text-secondary m-0">${t.shop_subtitle}</p></div></div>
<div class="row g-4" id="shopGrid">
${list.map(p=>{const isSaved=savedIds.includes(p.id);return `
<div class="col-lg-4 col-md-6">
<div class="product-card">
<button class="save-btn ${isSaved?'saved':''}" onclick="toggleSaveProduct(${p.id},event)" title="Save"><i class="bi ${isSaved?'bi-heart-fill':'bi-heart'}"></i></button>
<div><div class="product-img-wrap" onclick="viewProduct(${p.id})"><img src="${p.img}" class="product-img" alt="${p.title}"></div>
<h3 class="h6 fw-bold mb-2" onclick="viewProduct(${p.id})" style="cursor:pointer">${p.title}</h3><div class="product-price">${p.price}</div></div>
<div class="d-flex gap-2 mt-3"><button class="btn btn-outline-dark w-50 btn-sm py-2 btn-shop-action" onclick="viewProduct(${p.id})">${t.view}</button><button class="btn btn-dark w-50 btn-sm py-2 btn-shop-action" onclick="viewProduct(${p.id})"><i class="bi bi-bag"></i> ${t.cart}</button></div>
</div></div>`}).join('')}
</div>`;
}
function renderProductDetail(p){
const t=translations[currentLang],savedIds=getSavedItems(),isSaved=savedIds.includes(p.id);
const currentIndex=products.findIndex(item=>item.id===p.id);
const prevProduct=products[currentIndex>0?currentIndex-1:products.length-1];
const nextProduct=products[currentIndex<products.length-1?currentIndex+1:0];
document.getElementById('appContent').innerHTML=`
<div class="mb-4"><a href="shop.html" class="btn-back-custom" onclick="event.preventDefault();history.pushState({},'','shop.html');initApp()"><i class="bi bi-arrow-left"></i> ${t.back}</a></div>
<div class="row g-5 align-items-center">
<div class="col-lg-6 position-relative"><div class="detail-img-container">
<div class="position-absolute start-0 top-50 translate-middle-y ms-3 z-3"><button class="round-nav-btn" onclick="viewProduct(${prevProduct.id})"><i class="bi bi-chevron-left"></i></button></div>
<img src="${p.img}" class="animated-detail-hoodie" alt="${p.title}">
<div class="position-absolute end-0 top-50 translate-middle-y me-3 z-3"><button class="round-nav-btn" onclick="viewProduct(${nextProduct.id})"><i class="bi bi-chevron-right"></i></button></div>
</div></div>
<div class="col-lg-6"><h1 class="fw-bold mb-2">${p.title}</h1><div class="fs-4 fw-bold mb-4">${p.price}</div>
<p class="text-secondary mb-4 product-description">${p.desc}</p>
<div class="mb-4"><label class="form-label fw-bold small mb-2">${t.select_size}</label><div class="d-flex gap-2" id="sizeContainer">
<button class="btn size-btn" onclick="selectSize(this,'S')">S</button><button class="btn size-btn" onclick="selectSize(this,'M')">M</button><button class="btn size-btn" onclick="selectSize(this,'L')">L</button><button class="btn size-btn" onclick="selectSize(this,'XL')">XL</button>
</div></div>
<div class="d-flex gap-2 flex-wrap"><button class="btn btn-add-cart flex-grow-1" onclick="addToCart(${p.id})"><i class="bi bi-bag-plus me-2"></i>${t.add_to_cart}</button>
<button class="detail-save-btn ${isSaved?'saved':''}" onclick="toggleSaveProduct(${p.id})"><i class="bi ${isSaved?'bi-heart-fill':'bi-heart'}"></i>${isSaved?t.saved:t.save}</button></div>
</div></div>`;
selectedSize=null;
}
function viewProduct(id){history.pushState({},'',`shop.html?id=${id}`);initApp();window.scrollTo({top:0,behavior:'smooth'})}
function selectSize(btn,size){if(btn.classList.contains('active')){btn.classList.remove('active');selectedSize=null;return}document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');selectedSize=size}
function addToCart(id){
if(!selectedSize){alert(translations[currentLang].select_size_alert);return}
const p=products.find(item=>item.id==id);if(!p)return;
const cartItem={title:p.title,price:p.price,priceNum:p.priceNum,size:selectedSize,img:p.img,quantity:1};
localStorage.setItem('rakenCartItem',JSON.stringify(cartItem));window.location.href='cart.html';
}
function updateHeaderAccountState(){
const menuContent=document.getElementById('dropdownMenuContent');
const isLoggedIn=localStorage.getItem('rakenLoggedIn')==='true'||localStorage.getItem('isLoggedIn')==='true';
const username=localStorage.getItem('rakenUsername')||localStorage.getItem('userName')||'User';
const t=translations[currentLang];
if(!menuContent)return;
if(isLoggedIn){
menuContent.innerHTML=`<div class="small fw-bold text-secondary text-uppercase mb-1">${t.myProfile}</div>
<a href="saves.html" class="profile-link"><i class="bi bi-bookmark"></i>${t.menuSaves}</a>
<a href="cart.html" class="profile-link"><i class="bi bi-bag"></i>${t.menuCart}</a>
<a href="account.html" class="profile-link"><i class="bi bi-gear"></i>${t.menuAccount}</a>
<a href="#" class="profile-link text-danger" onclick="signOutUser(event)"><i class="bi bi-box-arrow-right"></i>${username} (${t.menuSignout})</a>`;
}else{
menuContent.innerHTML=`<h6>${t.bagEmpty}</h6><div class="signin-prompt">${t.bagSigninText}</div>
<div class="small fw-bold text-secondary text-uppercase mb-2">${t.myProfile}</div>
<a href="saves.html" class="profile-link"><i class="bi bi-bookmark"></i>${t.menuSaves}</a>
<a href="cart.html" class="profile-link"><i class="bi bi-bag"></i>${t.menuCart}</a>
<a href="account.html" class="profile-link"><i class="bi bi-gear"></i>${t.menuAccount}</a>
<a href="signin.html" class="profile-link"><i class="bi bi-person"></i>${t.menuSignin}</a>`;
}
}
function signOutUser(e){e.preventDefault();localStorage.removeItem('rakenLoggedIn');localStorage.removeItem('isLoggedIn');localStorage.removeItem('rakenUsername');localStorage.removeItem('userName');window.location.href='signin.html'}
window.addEventListener('popstate',initApp);
initApp();
</script>
</body>
</html>
