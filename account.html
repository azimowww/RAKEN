<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAKEN - Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { scroll-behavior: smooth; }
        body { font-family: Arial, sans-serif; color: #111; overflow-x: hidden; background-color: #fafafa; }
        
        .navbar { background: #fff; border-bottom: 1px solid #eaeaea; padding: 18px 0; }
        .logo { font-size: 28px; font-weight: bold; letter-spacing: 5px; cursor: pointer; text-decoration: none; color: #111; }
        .logo:hover { color: #111; }
        .nav-link { color: #111 !important; font-weight: 600; margin: 0 12px; transition: .3s; }
        .nav-link:hover { transform: translateY(-2px); }
        #languageSelect { width: 75px; border-radius: 0; }

        .account-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 100px);
            padding: 20px;
        }

        .account-container {
            width: 100%;
            max-width: 460px;
            background: #fff;
            border: 1px solid #eaeaea;
            padding: 45px 35px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.04);
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .account-avatar {
            width: 70px;
            height: 70px;
            background: #111;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 20px;
        }

        .account-container h2 {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
            color: #111;
            letter-spacing: 1px;
        }

        .user-info-box {
            background: #fbfbfb;
            border: 1px solid #ededed;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: #777;
            font-weight: 500;
        }

        .info-value {
            color: #111;
            font-weight: 600;
        }

        .status-badge {
            background: #e6f4ea;
            color: #137333;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .logout-btn {
            width: 100%;
            padding: 13px;
            background: #fff;
            color: #dc3545;
            border: 1px solid #dc3545;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: #dc3545;
            color: #fff;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: #111;
            color: #fff;
            border: 1px solid #111;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: #333;
            color: #fff;
            border-color: #333;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">

        <a class="navbar-brand logo" href="account.html">RAKEN</a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html" data-lang="home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="shop.html" data-lang="shop">Shop</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html" data-lang="about">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="contact.html" data-lang="contact">Contact</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">

                <select id="languageSelect"
                    class="form-select form-select-sm"
                    onchange="changeLanguage(this.value)">
                    <option value="EN">EN</option>
                    <option value="RU">RU</option>
                    <option value="AZ">AZ</option>
                </select>

                <div class="d-flex align-items-center gap-1">

                    <a href="https://www.instagram.com/raken.wear?dmpr=MXYwbndwZjR1ZW41Mg%3D%3D&utm_source=qr"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-btn instagram-btn"
                        title="Instagram">
                        <i class="bi bi-instagram"></i>
                    </a>

                    <a href="https://tiktok.com/@raken.clothing"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-btn tiktok-btn"
                        title="TikTok">
                        <i class="bi bi-tiktok"></i>
                    </a>

                </div>

                <div class="dropdown">

                    <button class="btn btn-dark cart-button dropdown-toggle cart-button-oval"
                        type="button"
                        id="cartDropdownMenu"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">

                        <i class="bi bi-bag"></i>

                    </button>

                    <div class="dropdown-menu cart-dropdown"
                        aria-labelledby="cartDropdownMenu"
                        id="dropdownMenuContent">
                    </div>

                </div>

            </div>
        </div>
    </div>
</nav>

<!-- Блок информации об аккаунте -->
<div class="account-wrapper">
    <div class="account-container">
        <div class="account-avatar" id="avatarLetter">U</div>
        <h2 data-lang="accountTitle">My Account</h2>
        
        <div class="user-info-box">
            <div class="info-row">
                <span class="info-label" data-lang="nameLabel">Name</span>
                <span class="info-value" id="profileName">-</span>
            </div>
            <hr class="my-2 text-muted opacity-25">
            <div class="info-row">
                <span class="info-label" data-lang="statusLabel">Status</span>
                <span class="status-badge" data-lang="statusActive">Active</span>
            </div>
        </div>

        <button id="logoutBtn" class="logout-btn" data-lang="logoutBtn">Sign Out</button>
        <a href="index.html" class="back-btn"><i class="bi bi-arrow-left"></i> <span data-lang="backHome">Back to Home</span></a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const translations = {
        EN: {
            home: "Home", shop: "Shop", about: "About", contact: "Contact",
            accountTitle: "Account Details",
            nameLabel: "Name",
            statusLabel: "Status",
            statusActive: "Active",
            logoutBtn: "Sign Out",
            backHome: "Back to Home"
        },
        RU: {
            home: "Главная", shop: "Магазин", about: "О нас", contact: "Контакты",
            accountTitle: "Данные аккаунта",
            nameLabel: "Имя",
            statusLabel: "Статус",
            statusActive: "Активен",
            logoutBtn: "Выйти из аккаунта",
            backHome: "На главную"
        },
        AZ: {
            home: "Ana səhifə", shop: "Mağaza", about: "Haqqımızda", contact: "Əlaqə",
            accountTitle: "Hesab Məlumatları",
            nameLabel: "Ad",
            statusLabel: "Status",
            statusActive: "Aktiv",
            logoutBtn: "Hesabdan çıxış",
            backHome: "Ana səhifəyə qayıt"
        }
    };

    const languageSelect = document.getElementById('languageSelect');

    function changeLanguage(lang) {
        document.querySelectorAll('[data-lang]').forEach(el => {
            const key = el.getAttribute('data-lang');
            if (translations[lang] && translations[lang][key]) {
                el.textContent = translations[lang][key];
            }
        });
        localStorage.setItem('selectedLang', lang);
        localStorage.setItem('rakenLang', lang);
    }

    languageSelect.addEventListener('change', (e) => {
        changeLanguage(e.target.value);
    });

    window.addEventListener('DOMContentLoaded', () => {
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        if (isLoggedIn !== 'true') {
            window.location.href = 'signin.html';
            return;
        }

        const userName = localStorage.getItem('userName') || 'User';
        document.getElementById('profileName').textContent = userName;
        
        // Автоматически ставим первую букву имени в аватарку кружочка сверху
        document.getElementById('avatarLetter').textContent = userName.charAt(0).toUpperCase();

        const savedLang = localStorage.getItem('selectedLang') || localStorage.getItem('rakenLang') || 'EN';
        languageSelect.value = savedLang;
        changeLanguage(savedLang);
    });

    document.getElementById('logoutBtn').addEventListener('click', function() {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('userName');
        window.location.href = 'index.html';
    });
</script>
</body>
</html>
